server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|png|jpe?g|gif|svg|woff2?|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public";
    }
}
